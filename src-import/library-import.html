<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excali Studio 素材库导入</title>
  <!--
    2026-10-18 B'：素材库「Add to Excalidraw」落地页（浏览器独立页）。
    由 src/library-import-page.ts 构建出的 lib-import.js（ES 单文件）驱动；
    页面本身零依赖、零构建，源在 src-import/，copy-dist 拷到插件根目录，
    内核挂在 /plugins/siyuan-excali-studio/library-import.html。
    StudioApp 的 libraryReturnUrl 指向本页（带 dir=图库目录参数）。
  -->
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2329;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #d3372c;
      --surface: #f8f9fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #3a3a3a;
        --accent: #e2605a;
        --surface: #262626;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      max-width: 560px;
      margin: 10vh 20px 40px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 24px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    #state {
      font-weight: 600;
      margin: 0 0 8px;
    }
    #detail {
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }
    #actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      padding: 7px 18px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #manual input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      margin: 8px 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Excali Studio 素材库导入</h1>
    <p class="sub">从 excalidraw 素材库网站导入 .excalidrawlib 到思源白板</p>
    <div class="card">
      <p id="state">正在读取导入链接…</p>
      <div id="detail"></div>
    </div>
    <div id="actions" hidden>
      <button id="btn-import" class="primary">导入到 Excali Studio</button>
      <button id="btn-cancel">取消</button>
    </div>
    <div id="manual" hidden>
      <div class="card">
        <p style="margin:0 0 8px;font-weight:600">手动粘贴</p>
        <input id="manual-url" type="text" placeholder="https://excalidraw.com#addLibrary=… 或 .excalidrawlib 直链" />
        <button id="btn-manual" class="primary">解析并导入</button>
      </div>
    </div>
    <p class="hint">图库目录：<span id="dir"></span> · 导入完成后关闭本页，回到思源白板窗口即自动合并进组件库面板（或点 ☰ → 刷新素材库）</p>
  </main>
  <script type="module" src="./lib-import.js"></script>
</body>
</html>
